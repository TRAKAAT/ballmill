<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball Mill — Shift Report</title>
<style>
  :root{
    --bg:#0f1419; --surface:#161d26; --surface2:#1d2630; --border:#2a3540;
    --white:#eef2f6; --muted:#8a97a5; --gold:#f0a500; --good:#3ecf8e; --bad:#e5534b;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--white);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:20px;}
  .wrap{max-width:1100px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  label{font-size:12px;color:var(--muted);font-weight:600;}
  input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--white);padding:9px 10px;font-size:14px;}
  input:focus{outline:none;border-color:var(--gold);}
  .btn{background:var(--gold);color:#1a1200;border:none;border-radius:6px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
  .btn:hover{opacity:.9;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);}
  .status{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:6px;display:none;}
  .status.show{display:block;}
  .status.info{background:rgba(240,165,0,.12);color:var(--gold);}
  .status.error{background:rgba(229,83,75,.12);color:var(--bad);}
  .status.success{background:rgba(62,207,142,.12);color:var(--good);}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px;}
  th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  th{background:var(--surface2);font-weight:700;position:sticky;top:0;}
  td:nth-child(-n+4){text-align:left;}
  tbody tr:nth-child(even){background:rgba(255,255,255,.02);}
  tfoot td{font-weight:700;background:var(--surface2);}
  .preview-scroll{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  .meta-pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted);margin-right:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Ball Mill — Shift Report</h1>
  <div class="sub">Generate a per-shift report (chute totals, product totals, crew, averages) and download as Excel.</div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="api-url">API URL</label>
        <input id="api-url" type="text" placeholder="https://your-app.onrender.com">
      </div>
      <div class="field">
        <label for="from-date">From</label>
        <input id="from-date" type="date">
      </div>
      <div class="field">
        <label for="to-date">To</label>
        <input id="to-date" type="date">
      </div>
      <button class="btn" id="generate-btn" onclick="generateReport()">Generate Report</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="btn btn-ghost" onclick="setRange('week')">This Week</button>
      <button class="btn btn-ghost" onclick="setRange('lastweek')">Last Week</button>
      <button class="btn btn-ghost" onclick="setRange('month')">This Month</button>
      <button class="btn btn-ghost" onclick="setRange('lastmonth')">Last Month</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="card" id="results-card" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div id="meta-pills"></div>
      <button class="btn" id="download-btn" onclick="downloadExcel()">⬇ Download Excel</button>
    </div>
    <div class="preview-scroll">
      <table id="preview-table"></table>
    </div>
  </div>
</div>

<script>
const CHUTES = ['1','2','3','4','5','6','BH1','BH2'];
let lastReport = null; // { headers, rows, fileName }

// ── Prefill from the same localStorage key the main app uses ──────────────
(function init(){
  const saved = localStorage.getItem('bm_server_url');
  if(saved) document.getElementById('api-url').value = saved;
  setRange('week');
})();

function pad(n){return String(n).padStart(2,'0');}
function toISODate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function setRange(type){
  const now = new Date();
  let from, to;
  if(type==='week'){
    const day = now.getDay()===0?6:now.getDay()-1; // Monday start
    from = new Date(now); from.setDate(now.getDate()-day);
    to = new Date(now);
  } else if(type==='lastweek'){
    const day = now.getDay()===0?6:now.getDay()-1;
    to = new Date(now); to.setDate(now.getDate()-day-1);
    from = new Date(to); from.setDate(to.getDate()-6);
  } else if(type==='month'){
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to = new Date(now);
  } else if(type==='lastmonth'){
    from = new Date(now.getFullYear(), now.getMonth()-1, 1);
    to = new Date(now.getFullYear(), now.getMonth(), 0);
  }
  document.getElementById('from-date').value = toISODate(from);
  document.getElementById('to-date').value = toISODate(to);
}

function showStatus(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status show ' + type;
}
function hideStatus(){
  document.getElementById('status').className = 'status';
}

function dateOnly(tsOrIso){
  const d = new Date(tsOrIso);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function fmtDuration(ms){
  if(ms==null || isNaN(ms)) return '—';
  const totalMin = Math.floor(ms/60000);
  return Math.floor(totalMin/60)+'h '+(totalMin%60)+'m';
}

async function generateReport(){
  const url = document.getElementById('api-url').value.trim().replace(/\/+$/,'');
  const fromDate = document.getElementById('from-date').value;
  const toDate = document.getElementById('to-date').value;
  if(!url){ showStatus('Enter the API URL first.', 'error'); return; }
  if(!fromDate || !toDate){ showStatus('Pick a from and to date.', 'error'); return; }

  // Remember the URL for next time, same key the main app uses
  localStorage.setItem('bm_server_url', url);

  const btn = document.getElementById('generate-btn');
  btn.disabled = true; btn.textContent = 'Loading...';
  showStatus('Pulling data from '+url+' ...', 'info');

  try{
    const res = await fetch(url+'/pull');
    if(!res.ok) throw new Error('Request failed ('+res.status+')');
    const data = await res.json();
    buildReport(data, fromDate, toDate);
    showStatus('Report ready — '+lastReport.rows.length+' shift(s) found.', 'success');
  }catch(e){
    showStatus('Error: '+e.message+'. Check the API URL and that the server is running.', 'error');
    document.getElementById('results-card').style.display = 'none';
  }finally{
    btn.disabled = false; btn.textContent = 'Generate Report';
  }
}

function buildReport(data, fromDate, toDate){
  const allShifts = data.shifts || [];
  const allBags = data.bags || [];
  const settings = data.settings || {};
  const feedMaterialsRaw = settings.feedMaterials;
  const feedMaterials = Array.isArray(feedMaterialsRaw) ? feedMaterialsRaw
                        : (feedMaterialsRaw && feedMaterialsRaw.value) ? feedMaterialsRaw.value : [];
  const feedNameMap = {};
  feedMaterials.forEach(f=>{ feedNameMap[f.id] = f.name; });

  const shifts = allShifts.filter(s=>{
    if(!s.startTime) return false;
    const d = dateOnly(s.startTime);
    return d>=fromDate && d<=toDate;
  }).sort((a,b)=>a.startTime-b.startTime);

  const shiftRows = shifts.map(shift=>{
    const shiftBags = allBags.filter(b=>b.shiftId===shift.id);
    const passBags = shiftBags.filter(b=>b.qc!=='reject');
    const chuteTotals = {}; CHUTES.forEach(c=>chuteTotals[c]=0);
    passBags.forEach(b=>{ if(b.chute) chuteTotals[b.chute]=(chuteTotals[b.chute]||0)+(b.weight||0); });
    const productTotals = {};
    passBags.forEach(b=>{ const k=b.productName||'Unclassified'; productTotals[k]=(productTotals[k]||0)+(b.weight||0); });
    const totalKg = passBags.reduce((s,b)=>s+(b.weight||0),0);
    const rejectKg = shiftBags.filter(b=>b.qc==='reject').reduce((s,b)=>s+(b.weight||0),0);
    return {
      date: dateOnly(shift.startTime),
      shiftType: shift.shiftType==='day'?'Day':shift.shiftType==='night'?'Night':(shift.shiftType||'—'),
      crew: (shift.crew||[]).join(', ')||'—',
      feedName: feedNameMap[shift.feedId] || shift.feedId || '—',
      duration: shift.endTime ? fmtDuration(shift.endTime - shift.startTime) : '—',
      chuteTotals, productTotals, totalKg, rejectKg, bagCount: passBags.length
    };
  });

  const allProductNames = Array.from(new Set(shiftRows.flatMap(r=>Object.keys(r.productTotals)))).sort();

  const headers = ['Date','Shift','Crew','Feed Material',
    ...CHUTES.map(c=>'Chute '+c+' (kg)'),
    ...allProductNames.map(p=>p+' (kg)'),
    'Total Usable (kg)','Rejects (kg)','Bags','Duration'];

  const rows = shiftRows.map(r=>[
    r.date, r.shiftType, r.crew, r.feedName,
    ...CHUTES.map(c=>r.chuteTotals[c]||0),
    ...allProductNames.map(p=>r.productTotals[p]||0),
    r.totalKg, r.rejectKg, r.bagCount, r.duration
  ]);

  lastReport = { headers, rows, allProductNames, fromDate, toDate, fileName: 'shift-report_'+fromDate+'_to_'+toDate+'.xlsx' };
  renderPreview();
  document.getElementById('results-card').style.display = 'block';
}

function average(arr){ return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }
function sum(arr){ return arr.reduce((a,b)=>a+b,0); }

function renderPreview(){
  const { headers, rows, fromDate, toDate } = lastReport;
  const metaEl = document.getElementById('meta-pills');
  metaEl.innerHTML =
    '<span class="meta-pill">Period: '+fromDate+' → '+toDate+'</span>'+
    '<span class="meta-pill">Shifts: '+rows.length+'</span>';

  const table = document.getElementById('preview-table');
  let html = '<thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{
    html += '<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>';
  });
  html += '</tbody>';

  if(rows.length>0){
    const numericColIdx = [];
    for(let i=4;i<headers.length-1;i++) numericColIdx.push(i); // exclude duration (last col)
    const avgRow = headers.map((h,i)=>{
      if(i===0) return 'AVERAGE';
      if(numericColIdx.includes(i)) return average(rows.map(r=>r[i])).toFixed(1);
      return '';
    });
    const totalRow = headers.map((h,i)=>{
      if(i===0) return 'TOTAL';
      if(numericColIdx.includes(i)) return sum(rows.map(r=>r[i]));
      return '';
    });
    html += '<tfoot>'+
      '<tr>'+avgRow.map(v=>'<td>'+v+'</td>').join('')+'</tr>'+
      '<tr>'+totalRow.map(v=>'<td>'+v+'</td>').join('')+'</tr>'+
      '</tfoot>';
  }
  table.innerHTML = html;
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=resolve; s.onerror=reject;
    document.head.appendChild(s);
  });
}

async function downloadExcel(){
  if(!lastReport) return;
  const btn = document.getElementById('download-btn');
  btn.disabled = true; btn.textContent = 'Preparing...';
  try{
    if(typeof XLSX === 'undefined'){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    }
    const { headers, rows } = lastReport;

    const aoa = [headers, ...rows];
    if(rows.length>0){
      const numericColIdx = [];
      for(let i=4;i<headers.length-1;i++) numericColIdx.push(i);
      const avgRow = headers.map((h,i)=> i===0?'AVERAGE PER SHIFT': numericColIdx.includes(i)? +average(rows.map(r=>r[i])).toFixed(1) : '');
      const totalRow = headers.map((h,i)=> i===0?'PERIOD TOTAL': numericColIdx.includes(i)? sum(rows.map(r=>r[i])) : '');
      aoa.push(avgRow, totalRow);
    }

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = headers.map((h,i)=> i===2 ? {wch:24} : i===3 ? {wch:18} : i===0 ? {wch:12} : {wch:13});

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Shift Report');
    XLSX.writeFile(wb, lastReport.fileName);
  }catch(e){
    showStatus('Error building Excel file: '+e.message, 'error');
  }finally{
    btn.disabled = false; btn.textContent = '⬇ Download Excel';
  }
}
</script>
</body>
</html>
